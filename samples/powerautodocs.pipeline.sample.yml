# =============================================================================
# PowerAutoDocs — Azure DevOps Pipeline
# =============================================================================
# SETUP: Copy this file into your client project repo and rename it (remove
# ".sample"). Suggested location:
#   PowerAutoDocs/powerautodocs.yml
#
# doc-gen.config.yml also lives in that PowerAutoDocs/ folder (DOC_GEN_CONFIG_DIR
# below points there). Both caches then land next to it, in a folder set by
# `cache.dir` in doc-gen.config.yml (default: .powerautodocs-cache) — see
# step 4, which commits that folder back to the repo.
#
# Then register it in Azure DevOps:
#   Pipelines → New Pipeline → Azure Repos Git → select your repo → Existing
#   Azure Pipelines YAML file → select this file
#
# Required setup before running:
#   1. Add a Pipeline Variable named WIKI_PAT (mark as secret)
#      The PAT needs Wiki (Read & Write) scope
#   2. Add PowerAutoDocs/doc-gen.config.yml
#      (copy and fill in samples/doc-gen.config.sample.yml)
#   3. Grant the ADO Build Service account "Contribute" permission on this
#      repo, so step 4 can push the cache commit back:
#      Project Settings → Repos → your repo → Security → find "<Project> Build
#      Service (<Org>)" → set Contribute to Allow. Without this the push in
#      step 4 fails with a permissions error (the run itself still succeeds).
#
# Optional pipeline variables:
#   POWERAUTODOCS_VERSION — npm version tag to pin (default: latest)
#                           Set in the ADO pipeline UI to lock a specific version
#
#   If you've enabled aiEnrichment in doc-gen.config.yml, also add:
#   ANTHROPIC_API_KEY (secret)      — required when aiEnrichment.provider: anthropic
#   AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_API_KEY — required when provider: azure-openai
#   (the exact names must match whatever you set as apiKeyEnv/endpointEnv in
#    doc-gen.config.yml — these are just the defaults used in the sample config)
#
#   IMPORTANT: secret pipeline variables are NOT automatically exposed as
#   environment variables to script steps — they must be explicitly mapped
#   via an `env:` block on the step that runs powerautodocs (see step 3 below),
#   exactly like WIKI_PAT is mapped in step 2.
# =============================================================================

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  POWERAUTODOCS_VERSION: latest
  DOC_GEN_CONFIG_DIR: $(Build.SourcesDirectory)/PowerAutoDocs

steps:

  # ---------------------------------------------------------------------------
  # 0. Checkout with push credentials persisted
  # Required so step 4 can push the cache commit back to this branch. ADO's
  # default checkout leaves the repo in detached HEAD with no push creds.
  # ---------------------------------------------------------------------------
  - checkout: self
    persistCredentials: true

  # ---------------------------------------------------------------------------
  # 1. Setup Node.js
  #
  # 24.x is the current Node LTS (supported until April 2028) and is what CI
  # tests against. The package needs >=22; 20 and 18 are both end-of-life and
  # are no longer supported here.
  # ---------------------------------------------------------------------------
  - task: NodeTool@0
    displayName: Setup Node.js
    inputs:
      versionSpec: '24.x'

  # ---------------------------------------------------------------------------
  # 2. Inject PAT into config
  # Replaces the REDACTED placeholder in doc-gen.config.yml with the actual
  # PAT from the pipeline secret variable at runtime.
  # The committed config file always contains REDACTED — never a real token.
  # ---------------------------------------------------------------------------
  - script: |
      sed -i "s/REDACTED/$(WIKI_PAT)/g" $(DOC_GEN_CONFIG_DIR)/doc-gen.config.yml
      echo "PAT injected into config"
    displayName: Inject wiki PAT
    env:
      WIKI_PAT: $(WIKI_PAT)

  # ---------------------------------------------------------------------------
  # 3. Run powerautodocs
  # Output (wiki, Word, or both) is controlled by output.wiki / output.word
  # in doc-gen.config.yml. Override at runtime with --wiki or --word flags.
  #
  # The env block maps secret pipeline variables through to the process —
  # required for any AI provider keys referenced via apiKeyEnv/endpointEnv
  # in doc-gen.config.yml. Remove the lines for providers you don't use.
  # ---------------------------------------------------------------------------
  - script: |
      npx powerautodocs@$(POWERAUTODOCS_VERSION)
    displayName: Generate documentation
    workingDirectory: $(Build.SourcesDirectory)
    env:
      DOC_GEN_CONFIG_DIR: $(DOC_GEN_CONFIG_DIR)
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
      AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
      AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)

  # ---------------------------------------------------------------------------
  # 4. Commit the cache back to the repo
  # Without this, the cache folder starts empty on every run — this pipeline
  # runs on an ephemeral agent, so nothing survives between runs unless it's
  # pushed back to git. Committing it here means unchanged content (AI
  # summaries and rendered diagrams alike) is skipped on the next run instead
  # of re-bought/re-rendered from scratch.
  #
  # Requires step 0's persistCredentials, and the ADO Build Service account
  # having Contribute permission on this repo (see setup note above) — this
  # step no-ops safely if there's nothing to commit, but the push will fail
  # with a permissions error if Contribute hasn't been granted.
  # ---------------------------------------------------------------------------
  - script: |
      git config user.email "powerautodocs-pipeline@$(System.TeamProject).local"
      git config user.name "PowerAutoDocs Pipeline"
      git add -f PowerAutoDocs/.powerautodocs-cache/
      if git diff --cached --quiet; then
        echo "No cache changes to commit"
      else
        git commit -m "chore: update powerautodocs cache [skip ci]"
        git push origin HEAD:$(Build.SourceBranchName)
      fi
    displayName: Commit cache
    workingDirectory: $(Build.SourcesDirectory)

  # ---------------------------------------------------------------------------
  # 5. Publish Word document as a downloadable pipeline artifact
  # Remove this step if you are not generating a Word document (output.word: false)
  # ---------------------------------------------------------------------------
  - task: PublishPipelineArtifact@1
    displayName: Publish Word document
    inputs:
      targetPath: 'output/solution-documentation.docx'
      artifact: 'solution-documentation'
      publishLocation: 'pipeline'
