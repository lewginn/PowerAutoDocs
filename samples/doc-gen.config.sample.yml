# =============================================================================
# doc-gen.config.yml — PowerAutoDocs configuration
# =============================================================================
# SETUP: Copy this file to your repo root and rename it to: doc-gen.config.yml
# Remove ".sample" from the filename — powerautodocs looks for doc-gen.config.yml
# Full documentation: https://github.com/lewginn/PowerAutoDocs
# =============================================================================


# -----------------------------------------------------------------------------
# SOLUTIONS
# List every unpacked Power Platform solution you want to document.
# All solutions are merged into a single output (wiki, Word and/or PDF).
# -----------------------------------------------------------------------------
solutions:
  - path: ./unpacked/MySolution       # Path to the unpacked solution folder
    publisherPrefix: myprefix         # Your publisher prefix (e.g. "contoso")
    displayName: My Solution          # Display name used in headings and the wiki

  # Add more solutions as needed:
  # - path: ./unpacked/AnotherSolution
  #   publisherPrefix: myprefix
  #   displayName: Another Solution


# -----------------------------------------------------------------------------
# OUTPUT
# Control what gets generated. You can enable wiki, Word, PDF, or any combination.
# CLI flags --wiki, --word and --pdf override these settings at runtime.
# -----------------------------------------------------------------------------
output:
  path: ./output                      # Local folder for generated files

  wiki: true                          # Publish to Azure DevOps Wiki
  word: true                          # Generate a Word (.docx) document
  wordFilename: solution-documentation.docx  # Word output filename

  pdf: false                          # Generate a PDF document (local file only — not published to ADO Wiki)
  pdfFilename: solution-documentation.pdf    # PDF output filename

  # ---------------------------------------------------------------------------
  # WORD THEME (optional)
  # Styling for the Word document. Omit this whole block for the built-in
  # default theme — it is already styled and needs no configuration.
  #
  # In most cases you only need `accentColor`: headings, table headers, row
  # banding, rules and code colour are all derived from it. The rest are here
  # for when you need exact control over one specific element.
  #
  # Colours accept '#0F62FE' or '0f62fe'. An invalid colour logs a warning and
  # falls back to the default — it never fails the run.
  #
  # Fonts: Word silently substitutes fonts that aren't installed on whatever
  # machine opens the document. Stick to fonts that ship with Office unless you
  # know every reader has yours installed.
  # ---------------------------------------------------------------------------
  # wordTheme:
  #   accentColor: '#2A6099'          # Your brand colour — most themes need only this
  #
  #   bodyFont: Calibri               # Body text font
  #   headingFont: Calibri Light      # Heading font (defaults to bodyFont if you set that)
  #   bodyFontSize: 10.5              # Body text size in points
  #   bodyColor: '#1A1A1A'            # Body text colour
  #
  #   headingColor: '#2A6099'         # Defaults to accentColor; levels 3-4 are darkened from it
  #   headingRule: true               # Horizontal rule under each top-level heading
  #
  #   tableHeaderFill: '#2A6099'      # Defaults to accentColor
  #   tableHeaderColor: '#FFFFFF'     # Defaults to white or near-black, whichever contrasts
  #   tableBanding: true              # Shade alternate rows
  #   tableFontSize: 9                # Table text size in points. A step below body text:
  #                                   # the tables are dense and wide, and body size forces
  #                                   # cells to wrap mid-word. Column widths are measured
  #                                   # at this size, so raising it widens columns.
  #   tableBandFill: '#EEF3F8'        # Defaults to a very light tint of accentColor
  #   tableBorderColor: '#C0D0E2'     # Defaults to a light tint of accentColor
  #
  #   codeFont: Courier New           # Inline code and code blocks
  #   codeFill: '#F2F2F2'             # Code background
  #   codeColor: '#1B3E63'            # Defaults to a darkened accentColor


# -----------------------------------------------------------------------------
# PARSE
# Controls how solution XML is read and filtered.
# -----------------------------------------------------------------------------
parse:
  customColumnsOnly: false            # true = only show columns with your publisher prefix
  excludeBaseCurrencyFields: true     # Exclude base currency columns (e.g. amount_base)
  excludeStandardRelationships: true  # Exclude OOB relationships (owner, team, business unit)

  # Columns to exclude from all table documentation.
  # These are standard system columns that add noise without value.
  excludedColumns:
    - timezoneruleversionnumber
    - utcconversiontimezonecode
    - importsequencenumber
    - overriddencreatedon
    - exchangerate
    - transactioncurrencyid
    - owningteam
    - owninguser
    - owningbusinessunit
    - createdonbehalfby
    - modifiedonbehalfby
    - versionnumber


# -----------------------------------------------------------------------------
# RENDER
# Controls how certain components are presented in the output.
# -----------------------------------------------------------------------------
render:
  formLayout: compact                 # compact | detailed


# -----------------------------------------------------------------------------
# COMPONENTS
# Enable or disable individual component types.
# This controls what gets rendered — all components are always parsed.
# -----------------------------------------------------------------------------
components:
  tables: true
  forms: true
  views: true
  relationships: true
  flows: true
  classicWorkflows: true
  plugins: true
  webResources: true
  securityRoles: true
  globalChoices: true
  emailTemplates: true
  modelDrivenApps: true
  connectionReferences: true

  environmentVariables:
    enabled: true
    showDefaultValue: true
    showCurrentValue: false           # Caution: current values may contain sensitive runtime data


# -----------------------------------------------------------------------------
# ERD (optional)
# Fine-tune the auto-generated ER diagram on the Data Model page.
# By default, only custom entities (matching your publisher prefix) are shown.
# Use these lists to exclude specific entities or relationships that add noise.
# -----------------------------------------------------------------------------
# erd:
#   excludeEntities:
#     - myprefix_auditlog
#   excludeRelationships:
#     - myprefix_leaverequest_myprefix_leavetype


# -----------------------------------------------------------------------------
# AI ENRICHMENT (optional)
# Generates short AI summaries for selected component types and embeds them
# on the relevant detail pages (hidden automatically when no summary exists).
#
# Cache-first: summaries are cached in `aiEnrichment.cacheFile` (JSON, commit
# it to your repo) keyed by a hash of each component's content. Re-runs only
# call the AI for components that changed — keeping output deterministic and
# cost low. Bumping promptVersion internally forces a full regeneration.
#
# Secrets follow the same pattern as wiki.pat/WIKI_PAT — name the env var here,
# inject the real value via your ADO pipeline secret variables. Never commit
# API keys or endpoints to this file.
# -----------------------------------------------------------------------------
# aiEnrichment:
#   enabled: true
#   provider: anthropic                 # anthropic | azure-openai
#   cacheFile: .powerautodocs-ai-cache.json
#
#   # Required when provider: anthropic
#   anthropic:
#     apiKeyEnv: ANTHROPIC_API_KEY      # Name of the env var holding the API key
#     model: claude-sonnet-4-5
#
#   # Required when provider: azure-openai
#   # azureOpenAI:
#   #   endpointEnv: AZURE_OPENAI_ENDPOINT
#   #   apiKeyEnv: AZURE_OPENAI_API_KEY # Omit if useManagedIdentity: true
#   #   useManagedIdentity: false       # Preferred enterprise path — zero secrets to rotate
#   #   deployment: gpt-4o-summariser
#   #   apiVersion: '2024-10-21'
#
#   # Opt in per component — deliberately a subset (complex/code-like artefacts
#   # benefit most from a plain-English summary). All default to false.
#   components:
#     flows: true
#     classicWorkflows: true
#     businessRules: true
#     plugins: true
#     webResources: true


# -----------------------------------------------------------------------------
# WIKI
# Required if output.wiki is true.
# The PAT must be injected at pipeline runtime — never commit a real value here.
#
# To inject via ADO pipeline, add WIKI_PAT as a secret pipeline variable and
# include this in your pipeline YAML env block:
#   env:
#     WIKI_PAT: $(WIKI_PAT)
# -----------------------------------------------------------------------------
wiki:
  organisation: MyOrg                 # ADO organisation name (from dev.azure.com/[org])
  project: MyProject                  # ADO project name
  wikiIdentifier: MyProject.wiki      # Wiki identifier (usually [Project].wiki)
  parentPath: /My Solution            # Parent page path in the wiki
  pat: REDACTED                       # Injected at runtime — do not commit a real PAT
