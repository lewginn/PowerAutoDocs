name: Publish to npm

on:
  release:
    # `published` fires whether a release is published directly or created as
    # a draft and published later — both cases this workflow needs to cover.
    # `created` was added alongside it under the (wrong) assumption that
    # publishing directly only fires `created` — it actually fires *both*
    # `created` and `published` for that case, which made this workflow run
    # twice per direct-publish release, with the second run always failing
    # (npm forbids republishing a version). `published` alone is sufficient.
    types: [published]
  # Manual escape hatch — lets us (re)trigger an npm publish from the Actions
  # tab or `gh workflow run "Publish to npm"` without needing a release event
  # at all (e.g. if a release event is ever missed again, or to republish).
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish from the newest supported LTS. CI proves the suite on 22 and 24;
      # the tarball itself is version-agnostic (tsc emits ES2020), so this only
      # decides which Node runs the build, not what clients can run.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci

      # Re-run the CI gate here rather than trusting that it passed on the merge
      # commit. A release can be cut from any ref, `workflow_dispatch` runs with no
      # PR behind it at all, and a publish is the one thing that cannot be undone —
      # npm forbids republishing a version. Duplicating ~40s of checks is cheap
      # against shipping a broken tarball to every client on `npx powerautodocs`.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
