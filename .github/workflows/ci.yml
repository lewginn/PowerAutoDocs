name: CI

# The compile gate. Before this workflow existed, `npm run build` ran only in
# npm-publish.yml — i.e. *after* a release was cut — so a TypeScript error could
# sit on `main` until release day. Runs on every PR and every push to `main`.
on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick follow-up commit shouldn't leave a stale run burning an
# agent. Cancel superseded runs on a branch, but never on main — those are the
# record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This workflow only reads the repo — it never comments, tags or publishes. An
# unrestricted GITHUB_TOKEN on a workflow that runs untrusted PR code is worth
# avoiding on principle. (CodeQL: actions/missing-workflow-permissions.)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Both live LTS lines, so engines.node ">=22" is a tested floor rather than an
    # assertion. It was ">=18" for a long time with nothing exercising 18 — and 18
    # (Apr 2025) and 20 (Apr 2026) are both now end-of-life.
    # 22 is the floor and 24 is what the sample pipeline ships; when 22 goes EOL
    # (Apr 2027), drop it here and raise engines in the same PR.
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    name: build (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` over `npm install` — installs from the lockfile exactly and fails
      # if package.json and package-lock.json have drifted apart.
      - run: npm ci

      # Typecheck before build: tsconfig.test.json covers src/ *and* tests/, so a
      # type error in a test is caught too. `npm run build` only sees src/.
      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
